[package]
name = "keeby"
version = "0.1.0"
edition = "2021"
description = "Lightweight Wayland on-screen keystroke + mouse activity overlay"
license = "MIT"
repository = "https://github.com/GabriWar/keeby"
readme = "README.md"

[dependencies]
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
calloop = "0.13"
calloop-wayland-source = "0.3"
tiny-skia = "0.11"
fontdue = "0.9"
evdev = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
